name: Deploy Django to EC2

on:
  push:
    branches:
      - Master 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Preparar y limpiar directorio en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Creamos la carpeta del proyecto si no existe
            mkdir -p /home/ubuntu/modulo-8-contabilidad
            
            # Navegamos al directorio del proyecto
            cd /home/ubuntu/modulo-8-contabilidad || exit 1 # Salir si no se puede cambiar de directorio

            # Limpiar archivos compilados y de caché de Python con sudo por si fueron creados por root
            sudo rm -rf BACKEND/adminContabilidad/__pycache__/
            sudo rm -rf BACKEND/moduloContabilidad/__pycache__/
            sudo rm -rf BACKEND/moduloContabilidad/migrations/__pycache__/
            sudo rm -rf BACKEND/moduloContabilidad/management/commands/__pycache__/
            
            # Asegurar que el usuario 'ubuntu' sea el propietario del directorio y su contenido
            # Esto es CRÍTICO para que rsync tenga permisos de escritura
            sudo chown -R ubuntu:ubuntu /home/ubuntu/modulo-8-contabilidad/

      - name: Subir código a EC2
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: "-avz --delete" # --delete es importante para limpiar archivos viejos
          path: "./" 
          remote_host: ${{ secrets.IP_SERVER }}
          remote_user: ${{ secrets.USERNAME }}
          remote_path: "/home/ubuntu/modulo-8-contabilidad/" 
          remote_key: ${{ secrets.PRIVATE_KEY }}
          remote_port: ${{ secrets.PORT }}

      - name: Crear archivo .env en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cat <<EOF > /home/ubuntu/modulo-8-contabilidad/.env
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=True
            MYSQL_DATABASE=BdContabilidad
            MYSQL_USER=USUARIOOCHO
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_HOST=db
            MYSQL_PORT=3306
            EOF

      - name: Levantar contenedores con Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Detener el servicio MySQL nativo de la EC2 (si está activo)
            sudo systemctl stop mysql || true 

            cd /home/ubuntu/modulo-8-contabilidad 
            
            # Detener y limpiar contenedores Docker Compose
            docker-compose down || true 

            # Eliminar el volumen de datos de MySQL para una base de datos limpia
            docker volume rm modulo-8-contabilidad_mysql_data || true 

            # Eliminar archivos de migración de Django para regenerar
            rm -rf BACKEND/moduloContabilidad/migrations/0*.py
            rm -rf BACKEND/moduloContabilidad/migrations/__init__.py # Asegurar que init.py no sea un problema
            rm -rf BACKEND/moduloContabilidad/migrations/__pycache__/

            # Construir y levantar contenedores
            docker-compose up -d --build

      - name: Ejecutar migraciones de Django
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ubuntu/modulo-8-contabilidad
            docker-compose exec backend python manage.py makemigrations moduloContabilidad --no-input
            docker-compose exec backend python manage.py migrate --no-input
            echo "Despliegue completado con éxito."

